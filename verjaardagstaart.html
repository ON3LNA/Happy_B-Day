<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Er is er één jarig!</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #85a4b8, #4fbce3);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
    }

    h1 {
      width: 100%;
      text-align: center;
      margin-bottom: 5%;
      color: white;
      font-size: 3rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px white; }
      to { text-shadow: 0 0 25px gold; }
    }

    .cake {
      position: relative;
      width: 250px;
      margin: 40px auto;
      margin-top: 80px;
    }

    .layer {
      /* border-radius: 12px; */
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      margin: auto;
      position: relative;
    }

    .bottom { width: 250px; height: 80px; background: #d2691e; }
    .middle { width: 200px; height: 70px; background: #ffb6c1; margin-top: -10px; }
    .top { width: 150px; height: 60px; background: #fffacd; margin-top: -10px; }

    .candles {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: absolute;
      top: -40px;
      width: 100%;
    }

    .candle {
      width: 12px;
      height: 50px;
      background: repeating-linear-gradient(
        45deg,
        #fff,
        #fff 5px,
        #87cefa 5px,
        #87cefa 10px
      );
      cursor: pointer;
      position: relative;
      border-radius: 4px;
    }

    .flame {
      width: 16px;
      height: 24px;
      background: radial-gradient(circle, yellow 20%, orange 60%, transparent 70%);
      border-radius: 50% 50% 50% 50%;
      position: absolute;
      top: -24px;
      left: -2px;
      animation: flicker 0.2s infinite alternate;
    }

    .off .flame { display: none; }

    @keyframes flicker {
      from { transform: scale(1) rotate(-2deg); }
      to { transform: scale(1.1) rotate(2deg); }
    }

    .message {
      color: white;
      font-size: 1.4rem;
      margin-top: 20px;
    }

    .confetti {
      position: absolute;
      top: -20px;
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      animation: fall 4s linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Gelukkige Verjaardag! 🎂</h1>
    <div class="cake">
      <div class="candles">
        <div class="candle" onclick="toggleFlame(this)"><div class="flame"></div></div>
        <div class="candle" onclick="toggleFlame(this)"><div class="flame"></div></div>
        <div class="candle" onclick="toggleFlame(this)"><div class="flame"></div></div>
        <div class="candle" onclick="toggleFlame(this)"><div class="flame"></div></div>
      </div>
      <div class="layer top"></div>
      <div class="layer middle"></div>
      <div class="layer bottom"></div>
    </div>
    <!-- <div class="message">Klik op de kaarsjes om ze aan of uit te doen ✨</div> -->
  </div>

  <script>
    function toggleFlame(candle) {
      candle.classList.toggle('off');
    }

    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.classList.add('confetti');
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDelay = Math.random() * 4 + 's';
      c.style.background = ['red','blue','yellow','green','purple'][Math.floor(Math.random()*5)];
      document.body.appendChild(c);
    }
  </script>
</body>
</html>
